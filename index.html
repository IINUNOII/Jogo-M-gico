<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ficha Interativa - Matemática 4.º Ano</title>
  <style>
    body {
      font-family: "Nunito", "Segoe UI", sans-serif;
      background: linear-gradient(120deg, #f3f5ff, #e6fff7);
      margin: 0;
      padding: 40px 16px;
      color: #2f2f3a;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }

    .hero {
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 18px 30px rgba(36, 38, 75, 0.12);
    }

    .hero h1 {
      margin-top: 0;
    }

    .links {
      margin-top: 24px;
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    a.card {
      text-decoration: none;
      padding: 18px;
      border-radius: 18px;
      background: #ffffff;
      border: 2px dashed #b6c2ff;
      color: inherit;
      transition: transform 0.2s ease;
    }

    a.card:hover {
      transform: translateY(-4px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <h1>🎒 Ficha Interativa de Matemática</h1>
      <p>Escolhe o teu acesso rápido:</p>
      <div class="links">
        <a class="card" href="ficha.html">👧🧒 Entrar como aluno</a>
        <a class="card" href="professor.html">👩‍🏫 Entrar como professor</a>
      </div>
      <p style="margin-top: 20px;">Link de acesso direto para alunos: <strong>ficha.html</strong></p>
    </div>
  </div>
</body>
</html>
